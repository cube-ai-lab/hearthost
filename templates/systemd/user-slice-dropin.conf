# Hearthost per-tenant resource cap, applied to logind's user-{UID}.slice.
# SSH/SFTP sessions and the tenant's PHP-FPM master both live here, so this
# one cap covers the whole tenant (CloudLinux LVE-style).
[Slice]
CPUQuota={{CPU_QUOTA}}
MemoryMax={{MEMORY_MAX}}
MemorySwapMax={{SWAP_MAX}}
TasksMax={{TASKS_MAX}}
ManagedOOMMemory=kill
