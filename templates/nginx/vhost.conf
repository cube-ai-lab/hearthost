# Per-site vhost. Placeholders filled by the CLI.
server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}}{{ALIASES}};
    include /etc/nginx/snippets/hearthost-acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
{{SSL_LISTEN}}
    server_name {{DOMAIN}}{{ALIASES}};
{{SSL_CERTS}}
    include /etc/nginx/snippets/hearthost-ssl-params.conf;
    include /etc/nginx/snippets/hearthost-headers.conf;
    include /etc/nginx/snippets/hearthost-dotfiles.conf;

    root {{DOCROOT}};
    access_log {{LOG_DIR}}/{{DOMAIN}}.access.log;
    error_log  {{LOG_DIR}}/{{DOMAIN}}.error.log;
    set $hh_fpm_socket "{{FPM_SOCKET}}";

    include /etc/nginx/snippets/hearthost-{{APP}}.conf;
}
