# Dedicated phpMyAdmin vhost. Never include this on a customer domain.
server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};
    set $hh_ssl_root "{{SSL_ROOT}}";
    include /etc/nginx/snippets/hearthost-acme.conf;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
{{SSL_LISTEN}}
    server_name {{DOMAIN}};
    ssl_certificate {{SSL_CERT}};
    ssl_certificate_key {{SSL_KEY}};
    include /etc/nginx/snippets/hearthost-ssl-params.conf;
    include /etc/nginx/snippets/hearthost-headers.conf;
    add_header X-Frame-Options DENY always;
    include /etc/nginx/snippets/hearthost-dotfiles.conf;

    root {{DOCROOT}};
    index index.php;
    access_log /var/log/nginx/phpmyadmin.access.log;
    error_log  /var/log/nginx/phpmyadmin.error.log;
    client_max_body_size 64m;

    location ^~ /setup {
        deny all;
    }
    location ^~ /libraries {
        deny all;
    }
    location ^~ /templates {
        deny all;
    }
    location ^~ /locale {
        deny all;
    }
    location ^~ /sql {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include /etc/nginx/snippets/hearthost-php.conf;
        fastcgi_pass unix:{{FPM_SOCKET}};
    }
}
