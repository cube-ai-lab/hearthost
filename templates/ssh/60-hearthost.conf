# Hearthost sshd policy.
# Included from sshd_config (first-obtained-value wins for each keyword).
# Do not disable AllowTcpForwarding — remote IDEs and SSH tunnels need it.
# Root stays allowed; tenants must be in AllowGroups (hearthost-ssh).

PermitRootLogin yes
PubkeyAuthentication yes
PermitEmptyPasswords no
MaxAuthTries 4
LoginGraceTime 45
X11Forwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
# Shell tenants are in hearthost-ssh; locked-down SFTP tenants in
# hearthost-sftp. A user in at least one listed group may connect.
AllowGroups hearthost-ssh hearthost-sftp

# SFTP-only jail. ChrootDirectory %h needs the home inode owned by root
# (hearthost user add --sftp-only sets that); tenant files live in the
# user-owned subdirs under it. No shell, no forwarding.
Match Group hearthost-sftp
    ChrootDirectory %h
    ForceCommand internal-sftp -u 0022
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
