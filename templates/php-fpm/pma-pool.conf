[hearthost-pma]
user = {{PMA_USER}}
group = {{PMA_USER}}
listen = {{FPM_SOCKET}}
listen.owner = {{PMA_USER}}
listen.group = {{WEB_USER}}
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 200

chdir = {{PMA_HOME}}
catch_workers_output = yes
security.limit_extensions = .php

php_admin_value[open_basedir] = {{OPEN_BASEDIR}}
php_admin_value[upload_tmp_dir] = {{PMA_HOME}}/tmp
php_admin_value[session.save_path] = {{PMA_HOME}}/tmp
php_admin_value[memory_limit] = 256M
php_admin_flag[allow_url_include] = off
php_admin_flag[expose_php] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,popen,show_source,pcntl_exec,pcntl_fork
