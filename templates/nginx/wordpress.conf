# Included from a per-domain server{} block.
index index.php index.html;

location / {
    try_files $uri $uri/ /index.php?$args;
}

location ~* /(?:uploads|files)/.*\.ph(?:p[0-9]?|t|tml)$ {
    deny all;
}

location ~* /wp-config\.php {
    deny all;
}

location = /xmlrpc.php {
    deny all;
}

location ~ \.php$ {
    include /etc/nginx/snippets/hearthost-php.conf;
    fastcgi_pass unix:$hh_fpm_socket;
}

location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2?)$ {
    expires 7d;
    access_log off;
    try_files $uri =404;
}
