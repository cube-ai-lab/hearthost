# Hearthost FastCGI microcache zone (http context). Shared by all sites that
# opt in with `site add --microcache N`. Cache files live off any tenant home.
fastcgi_cache_path /var/cache/nginx/hearthost levels=1:2 keys_zone=hearthost_microcache:10m max_size={{ZONE_MB}}m inactive=60m use_temp_path=off;
