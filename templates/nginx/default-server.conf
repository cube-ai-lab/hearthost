# Catch-all only. Tenant certs are /home/{user}/ssl/{domain}/, not here.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
{{SSL_LISTEN}}
    ssl_certificate /etc/hearthost/tls/default.crt;
    ssl_certificate_key /etc/hearthost/tls/default.key;
    include /etc/nginx/snippets/hearthost-ssl-params.conf;
    server_name _;
    include /etc/nginx/snippets/hearthost-dotfiles.conf;
    location / {
        return 404;
    }
}
